apply plugin: 'com.android.application'

android {
    // NOTE: the Java package / JNI namespace intentionally stays 'com.winlator' so that all
    // native symbol bindings (Java_com_winlator_*), R references and layout view paths remain
    // valid. Only the installed application identity below is rebranded to RAN Online Mobile.
    namespace 'com.winlator'
    compileSdk 35

    defaultConfig {
        // RAN Online Mobile installed package identity (see docs/RAN_MOBILE_ARCHITECTURE.md).
        // Changing this REQUIRES the matching data-dir paths in AppUtils.INTERNAL_STORAGE and the
        // native headers (cpp/*/include/*.h) to use the same id, and a native rebuild.
        applicationId 'com.kyudo.ranmobile'
        minSdkVersion 26
        targetSdkVersion 28
        versionCode 32
        versionName "11.2"
    }

    buildTypes {
        debug {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            ndk {
                abiFilters 'arm64-v8a'
            }
        }
    }

    lintOptions {
        checkReleaseBuilds false
    }

    ndkVersion '24.0.8215888'

    externalNativeBuild {
        cmake {
            version '3.22.1'
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'com.github.luben:zstd-jni:1.5.2-3@aar'
    implementation 'org.tukaani:xz:1.7'
    implementation 'org.apache.commons:commons-compress:1.20'
}
